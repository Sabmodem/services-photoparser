[project]
name = "photoparser-api"
version = "0.1.0"
description = "PhotoParser FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "pg8000>=1.30.0",
    "pydantic>=2.0.0",
    "rq>=1.15.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "greenlet>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "alembic>=1.14.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
