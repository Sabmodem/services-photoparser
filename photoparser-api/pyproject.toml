[project]
name = "photoparser-api"
version = "0.1.0"
description = "PhotoParser FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "pg8000>=1.30.0",
    "pydantic>=2.0.0",
    "rq>=1.15.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "greenlet>=3.0.0",
    "sqladmin>=0.20.0",
    "alembic>=1.14.0",
    "aiobotocore>=2.13.0",
    "botocore>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
