version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: photoparser_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: photoparserx
      POSTGRES_PASSWORD: XtCBlt3QcJ?L\9
      POSTGRES_DB: photoparser
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photoparserx -d photoparser"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./photoparser-api
      dockerfile: Dockerfile
    container_name: photoparser_migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://photoparserx:XtCBlt3QcJ%3FL%5C9@db:5432/photoparser
    command: >
      /bin/sh -c "alembic upgrade head"

  api:
    build:
      context: ./photoparser-api
      dockerfile: Dockerfile
    container_name: photoparser_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://photoparserx:XtCBlt3QcJ%3FL%5C9@db:5432/photoparser
      REDIS_URL: redis://redis:6379/0
      SEARXNG_URL: http://searxng:8080
      # S3/Minio storage
      S3_BUCKET: photoparser-downloads
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_REGION: us-east-1
      LOCAL_STORAGE_DIR: /tmp/photoparser-downloads
    expose:
      - "8000"
    volumes:
      - ./photoparser-api:/app
      - ./photoparser-api/alembic.ini:/app/alembic.ini
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      searxng:
        condition: service_started
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  ui:
    build:
      context: ./photoparser-ui
      dockerfile: Dockerfile
    container_name: photoparser_ui
    restart: unless-stopped
    depends_on:
      - api

  gateway:
    image: nginx:stable-alpine
    container_name: photoparser_gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ui
      - api

  redis:
    image: redis:7-alpine
    container_name: photoparser_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  worker:
    build:
      context: ./photoparser-api
      dockerfile: Dockerfile
    container_name: photoparser_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://photoparserx:XtCBlt3QcJ%3FL%5C9@db:5432/photoparser
      REDIS_URL: redis://redis:6379/0
      SEARXNG_URL: http://searxng:8080
      # S3/Minio storage (set to enable downloads)
      S3_BUCKET: photoparser-downloads
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_REGION: us-east-1
      LOCAL_STORAGE_DIR: /tmp/photoparser-downloads
    command: rqworker
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_healthy

  searxng:
    image: searxng/searxng:latest
    container_name: photoparser_searxng
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./photoparser-api/settings.yml:/etc/searxng/settings.yml
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081/
      - SEARXNG_LIMITER=false
      - SEARXNG_PUBLIC_INSTANCE=false
      - SEARXNG_SECRET=$(openssl rand -hex 32)
    depends_on:
      - redis

  minio:
    image: minio/minio:latest
    container_name: photoparser_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: photoparser_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/photoparser-downloads &&
        mc anonymous set download local/photoparser-downloads &&
        echo 'Minio bucket created and made public'
      "
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  searxng_data:
  minio_data:
